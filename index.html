<head>

<title>Renko Calendar</title>

<!-- ===================== CONFIGURAZIONE =====================
     Inserisci qui URL e chiave anon/publishable del progetto Supabase
     (Supabase > Project Settings > API). MAI la chiave service_role/secret. -->
<script>
const SUPABASE_URL = 'https://XXXXXXXX.supabase.co';
const SUPABASE_KEY = 'XXXXXXXX';
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>

<style>
:root {
  --bg: #f5f7fb;
  --panel: #ffffff;
  --text: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --primary: #1e3a8a;
  --primary-2: #2563eb;
  --danger: #dc2626;
  --radius: 10px;
  --shadow: 0 8px 30px rgba(15, 23, 42, .12);
  --fc-border-color: var(--line);
  --fc-today-bg-color: #eef4ff;
  --fc-now-indicator-color: var(--danger);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: var(--text);
  background: var(--bg);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1120; --panel: #111827; --text: #e5e7eb; --muted: #94a3b8;
    --line: #1f2937; --fc-today-bg-color: #172554; --fc-page-bg-color: #111827;
    --fc-neutral-bg-color: #1f2937; --fc-list-event-hover-bg-color: #1f2937;
  }
  input, select, textarea { color-scheme: dark; }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
[hidden] { display: none !important; }
h2 { font-size: 1.1rem; margin: 0; }
h3 { font-size: .95rem; margin: .5rem 0 0; }
.muted { color: var(--muted); }
.small { font-size: .82rem; }
.stack { display: flex; flex-direction: column; gap: .75rem; }
.row { display: flex; gap: .75rem; }
.row > label { flex: 1; }
.spacer { flex: 1; }

label { display: flex; flex-direction: column; gap: .3rem; font-size: .85rem; color: var(--muted); }
label.check, label.switch { flex-direction: row; align-items: center; gap: .5rem; color: var(--text); }
input, select, textarea {
  font: inherit; font-size: 16px; /* evita lo zoom su iPhone */
  padding: .55rem .7rem; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--text);
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary-2); outline-offset: -1px; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--primary-2); }
input[type=color] { padding: 2px; height: 40px; width: 80px; }

.btn {
  font: inherit; font-size: .9rem; cursor: pointer;
  padding: .5rem .9rem; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); color: var(--text);
  display: inline-flex; align-items: center; gap: .4rem;
}
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.icon { padding: .4rem .55rem; }
.btn.small { padding: .25rem .55rem; font-size: .8rem; }
.btn:disabled { opacity: .5; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--primary-2); cursor: pointer; font: inherit; font-size: .85rem; text-align: left; }
.link.danger { color: var(--danger); }

.msg { min-height: 1.2em; margin: 0; font-size: .85rem; color: var(--muted); }
.msg.error, #event-msg { color: var(--danger); }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; flex: none; }
.brand { display: flex; align-items: center; gap: .55rem; font-weight: 700; font-size: 1.05rem; }

/* ---------- accesso ---------- */
.auth { min-height: 100%; display: grid; place-items: center; padding: 1.5rem; }
.auth-card {
  width: min(400px, 100%); background: var(--panel); border-radius: 16px; box-shadow: var(--shadow);
  padding: 1.75rem; display: flex; flex-direction: column; gap: 1.1rem;
}
.tabs { display: flex; background: var(--bg); border-radius: 8px; padding: 3px; }
.tabs button { flex: 1; border: 0; background: none; padding: .5rem; border-radius: 6px; font: inherit; cursor: pointer; color: var(--muted); }
.tabs button.active { background: var(--panel); color: var(--text); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* ---------- app ---------- */
.app { height: 100dvh; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: .5rem;
  padding: .5rem 1rem; padding-top: max(.5rem, env(safe-area-inset-top));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.topbar-right { display: flex; align-items: center; gap: .25rem; }
#team-toggle { display: none; }

.layout { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 300px; }
.calendar { padding: .75rem; min-height: 0; background: var(--panel); }
.sidebar {
  border-left: 1px solid var(--line); background: var(--panel);
  padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem;
}
.side-head { display: flex; align-items: center; justify-content: space-between; }
.close-side { display: none; }
.side-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: auto; padding-top: .5rem; border-top: 1px solid var(--line); }

.invite { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; font-size: .85rem; }
.invite code { font-size: 1rem; font-weight: 700; letter-spacing: .08em; background: var(--bg); padding: .2rem .5rem; border-radius: 6px; }

.members { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.members li { display: flex; align-items: center; gap: .5rem; padding: .45rem 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
.members .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { font-size: .7rem; padding: .1rem .4rem; border-radius: 99px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.badge.off { background: #fef2f2; color: var(--danger); }

.fab {
  position: fixed; right: 1.25rem; bottom: calc(1.25rem + env(safe-area-inset-bottom));
  width: 56px; height: 56px; border-radius: 50%; border: 0;
  background: var(--primary); color: #fff; font-size: 1.8rem; line-height: 1;
  box-shadow: var(--shadow); cursor: pointer; z-index: 5;
}
@media (min-width: 761px) { .fab { right: calc(300px + 1.5rem); } }

/* FullCalendar */
.fc { font-size: .88rem; }
.fc .fc-toolbar-title { font-size: 1.15rem; text-transform: capitalize; }
.fc .fc-button-primary { background: var(--panel); color: var(--text); border-color: var(--line); text-transform: capitalize; }
.fc .fc-button-primary:not(:disabled).fc-button-active,
.fc .fc-button-primary:not(:disabled):active { background: var(--primary); border-color: var(--primary); color: #fff; }
.fc .fc-button-primary:disabled { background: var(--bg); color: var(--muted); border-color: var(--line); }
.fc-event.ev-other { opacity: .78; border-style: dashed; cursor: pointer; }
.fc-event.ev-mine { cursor: pointer; }

/* dialog */
dialog {
  border: 0; border-radius: 14px; padding: 1.4rem; width: min(480px, calc(100% - 1.5rem));
  background: var(--panel); color: var(--text); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(15, 23, 42, .45); }
.dialog-actions { display: flex; gap: .5rem; align-items: center; margin-top: .25rem; }

.toast {
  position: fixed; left: 50%; bottom: 1.5rem; transform: translate(-50%, 150%);
  background: #0f172a; color: #fff; padding: .7rem 1.1rem; border-radius: 10px;
  font-size: .9rem; transition: transform .25s, opacity .25s; z-index: 50; max-width: calc(100% - 2rem);
  opacity: 0; pointer-events: none;
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }
.toast.error { background: var(--danger); }

/* ---------- telefono ---------- */
@media (max-width: 760px) {
  .topbar .brand span, #me-name { display: none; }
  #team-toggle, .close-side { display: inline-flex; }
  .layout { grid-template-columns: 1fr; }
  .calendar { padding: .4rem; }
  .sidebar {
    position: fixed; inset: 0 0 0 auto; width: min(340px, 88vw); z-index: 20;
    transform: translateX(100%); transition: transform .25s; box-shadow: var(--shadow);
    padding-top: max(1rem, env(safe-area-inset-top));
  }
  .sidebar.open { transform: none; }
  .fc .fc-toolbar-title { font-size: 1rem; }
  .fc .fc-toolbar { gap: .4rem; }
  .fab { bottom: calc(4.2rem + env(safe-area-inset-bottom)); }
  .fc .fc-footer-toolbar .fc-button { font-size: .8rem; padding: .3rem .5rem; }
}
</style>
</head>
<body>

  <!-- ====================== ACCESSO ====================== -->
  <section id="auth-view" class="auth" hidden>
    <div class="auth-card">
      <div class="brand"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%231e3a8a'/%3E%3Crect x='96' y='128' width='320' height='288' rx='36' fill='white'/%3E%3Crect x='96' y='128' width='320' height='80' rx='36' fill='%2393c5fd'/%3E%3Crect x='96' y='172' width='320' height='36' fill='%2393c5fd'/%3E%3Crect x='160' y='92' width='32' height='72' rx='16' fill='white'/%3E%3Crect x='320' y='92' width='32' height='72' rx='16' fill='white'/%3E%3C/svg%3E" alt="" width="40" height="40" /> Renko Calendar</div>

      <form id="login-form" class="stack">
        <label>Email <input name="email" type="email" required autocomplete="email" /></label>
        <label>Password <input name="password" type="password" required autocomplete="current-password" /></label>
        <button class="btn primary" type="submit">Accedi</button>
      </form>

      <p id="auth-msg" class="msg" role="status"></p>
    </div>
  </section>

  <!-- ====================== APP ====================== -->
  <section id="app-view" class="app" hidden>
    <header class="topbar">
      <div class="brand"><img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%231e3a8a'/%3E%3Crect x='96' y='128' width='320' height='288' rx='36' fill='white'/%3E%3Crect x='96' y='128' width='320' height='80' rx='36' fill='%2393c5fd'/%3E%3Crect x='96' y='172' width='320' height='36' fill='%2393c5fd'/%3E%3Crect x='160' y='92' width='32' height='72' rx='16' fill='white'/%3E%3Crect x='320' y='92' width='32' height='72' rx='16' fill='white'/%3E%3C/svg%3E" alt="" width="28" height="28" /> <span>Renko Calendar</span></div>
      <div class="topbar-right">
        <button class="btn ghost" id="profile-btn" title="Il mio profilo"><span class="dot" id="me-dot"></span><span id="me-name"></span></button>
        <button class="btn ghost icon" id="team-toggle" title="Gruppo" aria-label="Mostra gruppo">👥</button>
        <button class="btn ghost" id="logout-btn">Esci</button>
      </div>
    </header>

    <main class="layout">
      <div id="calendar" class="calendar"></div>

      <aside id="sidebar" class="sidebar">
        <div class="side-head">
          <h2>Gruppo di lavoro</h2>
          <button class="btn ghost icon close-side" id="team-close" aria-label="Chiudi">✕</button>
        </div>

        <div id="no-team" class="stack" hidden>
          <p class="muted">Non sei ancora in nessun gruppo. Creane uno o entra con il codice che ti ha dato un collega.</p>
        </div>

        <div id="team-box" class="stack" hidden>
          <select id="team-select" aria-label="Gruppo selezionato"></select>

          <div class="invite">
            <span class="muted">Codice invito</span>
            <code id="invite-code"></code>
            <button class="btn small" id="copy-code" type="button">Copia</button>
            <button class="btn small" id="regen-code" type="button" hidden title="Genera un nuovo codice">↻</button>
          </div>

          <label class="switch">
            <input type="checkbox" id="share-toggle" />
            <span>Rendi visibili i miei impegni a questo gruppo</span>
          </label>

          <h3>Colleghi</h3>
          <p class="muted small">Spunta chi vuoi vedere nel tuo calendario.</p>
          <ul id="member-list" class="members"></ul>

          <button class="link danger" id="leave-team" type="button">Esci da questo gruppo</button>
        </div>

        <div class="side-actions">
          <button class="btn" id="create-team" type="button">+ Crea gruppo</button>
          <button class="btn" id="join-team" type="button">Entra con codice</button>
        </div>
      </aside>
    </main>

    <button class="fab" id="fab" aria-label="Nuovo impegno">+</button>
  </section>

  <!-- ====================== DIALOG IMPEGNO ====================== -->
  <dialog id="event-dialog">
    <form id="event-form" method="dialog" class="stack">
      <h2 id="event-dialog-title">Nuovo impegno</h2>
      <p id="event-owner" class="muted" hidden></p>

      <label>Titolo <input name="title" required maxlength="200" /></label>
      <label class="check"><input type="checkbox" name="all_day" /> Tutto il giorno</label>

      <div class="row">
        <label>Inizio <input name="start_date" type="date" required /></label>
        <label class="time">Ora <input name="start_time" type="time" step="300" /></label>
      </div>
      <div class="row">
        <label>Fine <input name="end_date" type="date" required /></label>
        <label class="time">Ora <input name="end_time" type="time" step="300" /></label>
      </div>

      <label>Luogo <input name="location" maxlength="200" /></label>
      <label>Note <textarea name="description" rows="3"></textarea></label>
      <label class="check"><input type="checkbox" name="is_private" /> Privato (i colleghi non lo vedono)</label>

      <p id="event-msg" class="msg"></p>

      <div class="dialog-actions">
        <button class="btn danger" type="button" id="event-delete" hidden>Elimina</button>
        <span class="spacer"></span>
        <button class="btn" type="button" id="event-cancel">Chiudi</button>
        <button class="btn primary" type="submit" id="event-save">Salva</button>
      </div>
    </form>
  </dialog>

  <!-- ====================== DIALOG GENERICO (testo) ====================== -->
  <dialog id="ask-dialog">
    <form method="dialog" class="stack" id="ask-form">
      <h2 id="ask-title"></h2>
      <label><span id="ask-label"></span> <input id="ask-input" required maxlength="60" /></label>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button class="btn" value="cancel" formnovalidate>Annulla</button>
        <button class="btn primary" value="ok">OK</button>
      </div>
    </form>
  </dialog>

  <!-- ====================== DIALOG PROFILO ====================== -->
  <dialog id="profile-dialog">
    <form method="dialog" class="stack" id="profile-form">
      <h2>Il mio profilo</h2>
      <label>Nome visualizzato <input name="display_name" required maxlength="60" /></label>
      <label>Colore dei miei impegni <input name="color" type="color" /></label>
      <p class="muted small" id="profile-email"></p>
      <div class="dialog-actions">
        <span class="spacer"></span>
        <button class="btn" value="cancel" formnovalidate>Annulla</button>
        <button class="btn primary" value="ok">Salva</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>


<script>

// ---------------------------------------------------------------- connessione
if (SUPABASE_URL.includes('XXXXXXXX') || !SUPABASE_KEY || SUPABASE_KEY.includes('XXXXXXXX')) {
  document.body.innerHTML = '<p style="padding:2rem;font-family:sans-serif">Configura SUPABASE_URL e SUPABASE_KEY in cima a index.html</p>';
  throw new Error('Supabase non configurato');
}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
});

// italiano per il calendario
const IT_LOCALE = {
  code: 'it',
  week: { dow: 1, doy: 4 },
  buttonText: { prev: 'Prec', next: 'Succ', today: 'Oggi', year: 'Anno', month: 'Mese', week: 'Settimana', day: 'Giorno', list: 'Agenda' },
  weekText: 'Sm',
  allDayText: 'Tutto il giorno',
  moreLinkText: (n) => '+altri ' + n,
  noEventsText: 'Nessun impegno',
};


// ------------------------------------------------------------------ utilità
const $ = (sel, root = document) => root.querySelector(sel);
const isMobile = () => window.matchMedia('(max-width: 760px)').matches;

const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* ignora */ }
  },
};

function toast(text, isError = false) {
  const el = $('#toast');
  el.textContent = text;
  el.classList.toggle('error', isError);
  el.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove('show'), 3200);
}

function errText(error) {
  const m = error?.message || String(error);
  if (/Invalid login credentials/i.test(m)) return 'Email o password errati.';
  if (/Email not confirmed/i.test(m)) return 'Devi prima confermare l\'email (controlla la posta).';
  if (/already registered/i.test(m)) return 'Questa email è già iscritta.';
  return m;
}

const pad = (n) => String(n).padStart(2, '0');
const dateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const timeStr = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addHours = (d, n) => new Date(d.getTime() + n * 3600_000);

// ------------------------------------------------------------------ stato
const state = {
  user: null,
  profile: null,
  teams: [],                 // [{ id, name, invite_code, role, share_events }]
  teamId: store.get('rc.team', null),
  members: [],               // membri del gruppo selezionato
  profiles: new Map(),       // user_id -> { display_name, color }
  hidden: new Set(store.get('rc.hidden', [])), // colleghi che NON voglio vedere
  calendar: null,
  channel: null,
  editing: null,             // riga evento in modifica (o null se nuovo)
};

// ================================================================== ACCESSO
// Gli utenti li crea l'amministratore in Supabase > Authentication > Users.
function showAuth() {
  $('#app-view').hidden = true;
  $('#auth-view').hidden = false;
  authMsg('');
}

function authMsg(text, isError = false) {
  const el = $('#auth-msg');
  el.textContent = text;
  el.classList.toggle('error', isError);
}

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = new FormData(e.target);
  authMsg('Accesso in corso…');
  const { error } = await sb.auth.signInWithPassword({
    email: f.get('email').trim(), password: f.get('password'),
  });
  if (error) authMsg(errText(error), true);
});

$('#logout-btn').addEventListener('click', () => sb.auth.signOut());

sb.auth.onAuthStateChange((event, session) => {
  // le chiamate a Supabase vanno fuori dalla callback (evita blocchi)
  setTimeout(() => {
    if (session?.user) {
      if (state.user?.id !== session.user.id) startApp(session.user);
    } else {
      stopApp();
      showAuth();
    }
  }, 0);
});

// ================================================================== APP
async function startApp(user) {
  state.user = user;
  $('#auth-view').hidden = true;
  $('#app-view').hidden = false;

  await loadProfile();
  initCalendar();
  await loadTeams();
  subscribeRealtime();
}

function stopApp() {
  state.user = null;
  state.profile = null;
  if (state.channel) sb.removeChannel(state.channel);
  state.channel = null;
  if (state.calendar) state.calendar.destroy();
  state.calendar = null;
}

// ------------------------------------------------------------------ profilo
async function loadProfile() {
  const { data, error } = await sb.from('profiles').select('*').eq('id', state.user.id).single();
  if (error) return toast(errText(error), true);
  state.profile = data;
  state.profiles.set(data.id, data);
  $('#me-name').textContent = data.display_name;
  $('#me-dot').style.background = data.color;
}

$('#profile-btn').addEventListener('click', () => {
  const f = $('#profile-form');
  f.display_name.value = state.profile.display_name;
  f.color.value = state.profile.color;
  $('#profile-email').textContent = state.user.email;
  $('#profile-dialog').returnValue = '';
  $('#profile-dialog').showModal();
});

$('#profile-dialog').addEventListener('close', async () => {
  if ($('#profile-dialog').returnValue !== 'ok') return;
  const f = $('#profile-form');
  const { error } = await sb.from('profiles')
    .update({ display_name: f.display_name.value.trim(), color: f.color.value })
    .eq('id', state.user.id);
  if (error) return toast(errText(error), true);
  await loadProfile();
  await loadMembers();
  state.calendar?.refetchEvents();
});

// ------------------------------------------------------------------ gruppi
async function loadTeams() {
  const { data, error } = await sb
    .from('team_members')
    .select('role, share_events, team:teams(id, name, invite_code)')
    .eq('user_id', state.user.id)
    .order('joined_at');
  if (error) return toast(errText(error), true);

  state.teams = data.filter((r) => r.team).map((r) => ({ ...r.team, role: r.role, share_events: r.share_events }));
  if (!state.teams.some((t) => t.id === state.teamId)) state.teamId = state.teams[0]?.id ?? null;
  store.set('rc.team', state.teamId);

  const sel = $('#team-select');
  sel.innerHTML = '';
  for (const t of state.teams) sel.add(new Option(t.name, t.id, false, t.id === state.teamId));

  $('#no-team').hidden = state.teams.length > 0;
  $('#team-box').hidden = state.teams.length === 0;
  await loadMembers();
}

const currentTeam = () => state.teams.find((t) => t.id === state.teamId);

async function loadMembers() {
  const team = currentTeam();
  state.members = [];
  if (team) {
    const { data, error } = await sb
      .from('team_members')
      .select('user_id, role, share_events, profile:profiles(id, display_name, color)')
      .eq('team_id', team.id);
    if (error) return toast(errText(error), true);
    state.members = data.filter((m) => m.profile);
    for (const m of state.members) state.profiles.set(m.user_id, m.profile);
  }
  renderTeamPanel();
  state.calendar?.refetchEvents();
}

function renderTeamPanel() {
  const team = currentTeam();
  if (!team) return;
  $('#invite-code').textContent = team.invite_code;
  $('#regen-code').hidden = team.role !== 'owner';

  const me = state.members.find((m) => m.user_id === state.user.id);
  $('#share-toggle').checked = me ? me.share_events : true;

  const list = $('#member-list');
  list.innerHTML = '';
  const sorted = [...state.members].sort((a, b) =>
    (a.user_id === state.user.id ? -1 : b.user_id === state.user.id ? 1 : 0) ||
    a.profile.display_name.localeCompare(b.profile.display_name));

  for (const m of sorted) {
    const isMe = m.user_id === state.user.id;
    const li = document.createElement('li');

    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = isMe || (m.share_events && !state.hidden.has(m.user_id));
    cb.disabled = isMe || !m.share_events;
    cb.title = isMe ? 'Sei tu' : m.share_events ? 'Mostra/nascondi nel mio calendario' : 'Ha scelto di non condividere';
    cb.addEventListener('change', () => {
      cb.checked ? state.hidden.delete(m.user_id) : state.hidden.add(m.user_id);
      store.set('rc.hidden', [...state.hidden]);
      state.calendar?.refetchEvents();
    });

    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = m.profile.color;

    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = m.profile.display_name + (isMe ? ' (tu)' : '');

    li.append(cb, dot, name);

    if (m.role === 'owner') li.append(badge('admin'));
    if (!m.share_events) li.append(badge('non condivide', 'off'));

    if (team.role === 'owner' && !isMe) {
      const x = document.createElement('button');
      x.className = 'btn ghost icon small';
      x.textContent = '✕';
      x.title = 'Rimuovi dal gruppo';
      x.addEventListener('click', () => removeMember(m));
      li.append(x);
    }
    list.append(li);
  }
}

function badge(text, cls = '') {
  const b = document.createElement('span');
  b.className = `badge ${cls}`;
  b.textContent = text;
  return b;
}

$('#team-select').addEventListener('change', (e) => {
  state.teamId = e.target.value;
  store.set('rc.team', state.teamId);
  loadMembers();
});

$('#share-toggle').addEventListener('change', async (e) => {
  const { error } = await sb.from('team_members')
    .update({ share_events: e.target.checked })
    .eq('team_id', state.teamId).eq('user_id', state.user.id);
  if (error) { e.target.checked = !e.target.checked; return toast(errText(error), true); }
  toast(e.target.checked ? 'I tuoi impegni sono visibili al gruppo' : 'I tuoi impegni ora sono nascosti al gruppo');
  await loadTeams();
});

$('#copy-code').addEventListener('click', async () => {
  const code = currentTeam().invite_code;
  if (window.RenkoApp?.copy) { window.RenkoApp.copy(code); return toast('Codice copiato'); } // app Android
  try { await navigator.clipboard.writeText(code); toast('Codice copiato'); }
  catch { toast('Copia non riuscita: selezionalo a mano', true); }
});

$('#regen-code').addEventListener('click', async () => {
  if (!confirm('Generare un nuovo codice? Quello vecchio smetterà di funzionare.')) return;
  const { error } = await sb.rpc('regenerate_invite', { p_team: state.teamId });
  if (error) return toast(errText(error), true);
  await loadTeams();
});

$('#create-team').addEventListener('click', async () => {
  const name = await ask('Nuovo gruppo', 'Nome del gruppo');
  if (!name) return;
  const { data, error } = await sb.rpc('create_team', { p_name: name });
  if (error) return toast(errText(error), true);
  state.teamId = data.id;
  await loadTeams();
  toast(`Gruppo creato. Codice invito: ${data.invite_code}`);
});

$('#join-team').addEventListener('click', async () => {
  const code = await ask('Entra in un gruppo', 'Codice invito');
  if (!code) return;
  const { data, error } = await sb.rpc('join_team', { p_code: code });
  if (error) return toast(errText(error), true);
  state.teamId = data.id;
  await loadTeams();
  toast(`Sei entrato in ${data.name}`);
});

$('#leave-team').addEventListener('click', async () => {
  const team = currentTeam();
  if (!team || !confirm(`Uscire dal gruppo "${team.name}"?`)) return;
  const { error } = await sb.from('team_members')
    .delete().eq('team_id', team.id).eq('user_id', state.user.id);
  if (error) return toast(errText(error), true);
  await loadTeams();
});

async function removeMember(m) {
  if (!confirm(`Rimuovere ${m.profile.display_name} dal gruppo?`)) return;
  const { error } = await sb.from('team_members')
    .delete().eq('team_id', state.teamId).eq('user_id', m.user_id);
  if (error) return toast(errText(error), true);
  await loadMembers();
}

// sidebar a scomparsa su telefono
$('#team-toggle').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
$('#team-close').addEventListener('click', () => $('#sidebar').classList.remove('open'));

function ask(title, label) {
  const dlg = $('#ask-dialog');
  $('#ask-title').textContent = title;
  $('#ask-label').textContent = label;
  $('#ask-input').value = '';
  dlg.returnValue = '';
  dlg.showModal();
  return new Promise((resolve) => {
    dlg.addEventListener('close', () => {
      resolve(dlg.returnValue === 'ok' ? $('#ask-input').value.trim() : null);
    }, { once: true });
  });
}

// ================================================================== CALENDARIO
function initCalendar() {
  if (state.calendar) state.calendar.destroy();
  const mobile = isMobile();

  state.calendar = new FullCalendar.Calendar($('#calendar'), {
    locales: [IT_LOCALE],
    locale: 'it',
    timeZone: 'local',
    initialView: store.get('rc.view', mobile ? 'timeGridDay' : 'timeGridWeek'),
    headerToolbar: mobile
      ? { left: 'prev,next', center: 'title', right: 'today' }
      : { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek' },
    footerToolbar: mobile ? { center: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek' } : false,
    height: '100%',
    nowIndicator: true,
    firstDay: 1,
    slotMinTime: '06:00:00',
    slotMaxTime: '23:00:00',
    scrollTime: '08:00:00',
    allDayText: 'giorno',
    selectable: true,
    selectMirror: true,
    longPressDelay: 350,
    editable: true,
    eventStartEditable: true,
    dayMaxEvents: true,
    events: fetchEvents,
    select: (info) => { openEventDialog(null, info); state.calendar.unselect(); },
    eventClick: (info) => openEventDialog(info.event.extendedProps.row),
    eventDrop: moveEvent,
    eventResize: moveEvent,
    datesSet: (info) => store.set('rc.view', info.view.type),
  });
  state.calendar.render();
}

async function fetchEvents(info, success, failure) {
  if (!state.user) return success([]);
  // RLS di Supabase restituisce già solo: i miei + quelli condivisi dei colleghi
  const { data, error } = await sb
    .from('events')
    .select('*')
    .lt('start_at', info.end.toISOString())
    .gte('end_at', info.start.toISOString())
    .order('start_at');
  if (error) { toast(errText(error), true); return failure(error); }

  const teamMembers = new Set(state.members.map((m) => m.user_id));
  const me = state.user.id;

  success(data
    .filter((ev) => ev.owner_id === me || (teamMembers.has(ev.owner_id) && !state.hidden.has(ev.owner_id)))
    .map((ev) => {
      const mine = ev.owner_id === me;
      const owner = state.profiles.get(ev.owner_id);
      const color = owner?.color || '#64748b';
      return {
        id: ev.id,
        title: mine ? (ev.is_private ? `🔒 ${ev.title}` : ev.title) : `${owner?.display_name ?? '?'} · ${ev.title}`,
        start: ev.start_at,
        end: ev.end_at,
        allDay: ev.all_day,
        backgroundColor: color,
        borderColor: color,
        editable: mine,
        classNames: mine ? ['ev-mine'] : ['ev-other'],
        extendedProps: { row: ev },
      };
    }));
}

async function moveEvent(info) {
  const ev = info.event;
  const end = ev.end ?? (ev.allDay ? addDays(ev.start, 1) : addHours(ev.start, 1));
  const { error } = await sb.from('events').update({
    start_at: ev.start.toISOString(), end_at: end.toISOString(), all_day: ev.allDay,
  }).eq('id', ev.id);
  if (error) { info.revert(); toast(errText(error), true); }
}

// ------------------------------------------------------------------ dialog impegno
const form = $('#event-form');

function setTimeVisibility() {
  const allDay = form.all_day.checked;
  form.querySelectorAll('.time').forEach((el) => (el.hidden = allDay));
  form.start_time.required = !allDay;
  form.end_time.required = !allDay;
}
form.all_day.addEventListener('change', setTimeVisibility);

// se sposto l'inizio dopo la fine, la fine segue
form.start_date.addEventListener('change', () => {
  if (form.end_date.value < form.start_date.value) form.end_date.value = form.start_date.value;
});

function openEventDialog(row, selection) {
  state.editing = row;
  const mine = !row || row.owner_id === state.user.id;
  form.reset();
  $('#event-msg').textContent = '';

  let start, end, allDay;
  if (row) {
    start = new Date(row.start_at); end = new Date(row.end_at); allDay = row.all_day;
    form.title.value = row.title;
    form.location.value = row.location || '';
    form.description.value = row.description || '';
    form.is_private.checked = row.is_private;
  } else if (selection) {
    start = selection.start; end = selection.end; allDay = selection.allDay;
  } else {
    start = new Date(); start.setMinutes(0, 0, 0); start = addHours(start, 1);
    end = addHours(start, 1); allDay = false;
  }

  // nei giorni interi la fine è esclusiva: nel form mostro l'ultimo giorno incluso
  const shownEnd = allDay ? addDays(end, -1) : end;
  form.all_day.checked = allDay;
  form.start_date.value = dateStr(start);
  form.start_time.value = allDay ? '09:00' : timeStr(start);
  form.end_date.value = dateStr(shownEnd < start ? start : shownEnd);
  form.end_time.value = allDay ? '10:00' : timeStr(end);
  setTimeVisibility();

  $('#event-dialog-title').textContent = row ? (mine ? 'Modifica impegno' : 'Impegno del collega') : 'Nuovo impegno';
  const owner = row && !mine ? state.profiles.get(row.owner_id) : null;
  $('#event-owner').hidden = !owner;
  $('#event-owner').textContent = owner ? `Di ${owner.display_name}` : '';

  form.querySelectorAll('input, textarea').forEach((el) => (el.disabled = !mine));
  $('#event-save').hidden = !mine;
  $('#event-delete').hidden = !(row && mine);
  $('#event-dialog').showModal();
}

$('#event-cancel').addEventListener('click', () => $('#event-dialog').close());

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const allDay = form.all_day.checked;
  let start, end;
  if (allDay) {
    start = new Date(`${form.start_date.value}T00:00`);
    end = addDays(new Date(`${form.end_date.value}T00:00`), 1);
  } else {
    start = new Date(`${form.start_date.value}T${form.start_time.value}`);
    end = new Date(`${form.end_date.value}T${form.end_time.value}`);
  }
  if (!(end > start)) {
    $('#event-msg').textContent = 'La fine deve essere dopo l\'inizio.';
    return;
  }

  const payload = {
    title: form.title.value.trim(),
    location: form.location.value.trim(),
    description: form.description.value.trim(),
    is_private: form.is_private.checked,
    all_day: allDay,
    start_at: start.toISOString(),
    end_at: end.toISOString(),
  };

  $('#event-save').disabled = true;
  const { error } = state.editing
    ? await sb.from('events').update(payload).eq('id', state.editing.id)
    : await sb.from('events').insert(payload);
  $('#event-save').disabled = false;

  if (error) { $('#event-msg').textContent = errText(error); return; }
  $('#event-dialog').close();
  state.calendar.refetchEvents();
});

$('#event-delete').addEventListener('click', async () => {
  if (!state.editing || !confirm('Eliminare questo impegno?')) return;
  const { error } = await sb.from('events').delete().eq('id', state.editing.id);
  if (error) { $('#event-msg').textContent = errText(error); return; }
  $('#event-dialog').close();
  state.calendar.refetchEvents();
});

$('#fab').addEventListener('click', () => openEventDialog(null, null));

// ================================================================== REALTIME
function subscribeRealtime() {
  if (state.channel) sb.removeChannel(state.channel);
  let t;
  const refetch = () => { clearTimeout(t); t = setTimeout(() => state.calendar?.refetchEvents(), 300); };
  let tm;
  const reloadTeams = () => { clearTimeout(tm); tm = setTimeout(loadTeams, 300); };

  state.channel = sb.channel('rc-live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, refetch)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'team_members' }, reloadTeams)
    .subscribe();
}

// quando l'app torna in primo piano (telefono) ricarico
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.user) state.calendar?.refetchEvents();
});
</script>
